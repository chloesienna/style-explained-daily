media:
  input: assets
  output: /assets
  rename: safe
content:
  - name: looks
    label: Shop the Looks
    type: file
    path: data/looks.json
    format: json
    list: true
    fields:
      - name: title
        label: Look title
        type: string
        required: true
      - name: subtitle
        label: Short description on homepage
        type: text
      - name: category
        label: Category
        type: select
        options:
          values:
            - value: five
              label: Five Looks
            - value: color
              label: Color Guides
            - value: tips
              label: Styling Tips
      - name: image
        label: Main image
        type: image
      - name: description
        label: Look description
        type: text
      - name: published
        label: Show on website
        type: boolean
      - name: products
        label: Featured shopping links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: productId
            label: Product library ID (e.g. product-001)
            type: string
          - name: name
            label: Display name (optional override)
            type: string
          - name: note
            label: Label (exact or similar)
            type: string
      - name: outfits
        label: Outfits in this edit
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Outfit title
            type: string
          - name: description
            label: Outfit styling notes
            type: text
          - name: image
            label: Outfit image
            type: image
          - name: products
            label: Products for this outfit
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: productId
                label: Product library ID (e.g. product-001)
                type: string
              - name: name
                label: Display name (optional override)
                type: string
              - name: note
                label: Label (exact or similar)
                type: string
  - name: product-library
    label: Product Library
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: id
        label: Unique product ID (auto-filled after Save; leave blank)
        type: string
      - name: name
        label: Product name
        type: string
      - name: store
        label: Store
        type: string
      - name: image
        label: Product image
        type: image
      - name: url
        label: Shopping URL
        type: string
      - name: affiliate
        label: Affiliate link (advertising)
        type: boolean
      - name: status
        label: Link status
        type: select
        options:
          values:
            - value: needs-review
              label: Needs review
            - value: verified
              label: Verified
            - value: unavailable
              label: Unavailable
      - name: note
        label: Notes
        type: text
